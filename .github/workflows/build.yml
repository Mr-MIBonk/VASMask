name: build

# Every push builds the project. A push to main also publishes release
# v<VERSION> (from the VERSION file) unless that release already exists, so a
# new release is made by bumping VERSION.
on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tester/go.mod

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Test
        working-directory: tester
        run: |
          go test .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GOARCH = '386'
          go test .

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Package
        id: package
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = "VASMask-$version.zip"
          Remove-Item dist\*.log, dist\x64\*.log -ErrorAction SilentlyContinue
          Copy-Item LICENSE, README.md dist\
          Compress-Archive -Path dist\* -DestinationPath $zip
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.package.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists; bump VERSION to publish a new one."
            exit 0
          }
          gh release create $env:TAG $env:ZIP --target $env:GITHUB_SHA --title "VASMask $env:TAG" --generate-notes
