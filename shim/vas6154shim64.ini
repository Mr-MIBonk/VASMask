; VAS6154 mask shim configuration (64-bit, VW D-PDU API)
[shim]
; Real 64-bit VW D-PDU API; it reaches the VAS5054A through its 32-bit J2534 driver.
; "Install into ODIS" gives ODIS-E (VW_D_PDU_API_OE) and ODIS-S (VW_D_PDU_API_OS) each a
; shim copy PDUAPI_VAS6154_Shim_<api>.dll; its section [PDUAPI_VAS6154_Shim_<api>] below
; overrides keys of [shim] (Target = that API's own PDUAPI_VW.dll).
Target=C:\Program Files\VW_PDUAPI_OE\PDUAPI_VW.dll
; Type mask: the J2534 module (MDF_VW type 12) whose name contains MatchName
; is reported as MDF_VW module type ToTypeId: 14 = VAS6154A (DIF-VAS6154A-OE/-OS), 3 = VAS6154
FromTypeId=12
ToTypeId=14
MatchName=VAS5054
; Same VCI registered more than once for J2534 (e.g. Softing + SRT): show it once
HideDuplicates=1
; Module name reported for it; {serial} = serial number from the real name (after '#').
; ODIS-Diagsetup-Config.xml binds the interface by MODULE-NAME, so ModuleName='...' must be
; exactly VAS6154A (or VAS6154 with ToTypeId=3). Empty = real name with FromName replaced by ToName.
ModuleName=VendorName='Volkswagen AG' ModuleName='VAS6154A' SerialNumber='{serial}'
FromName=VAS5054A
ToName=VAS6154A
; Optional overrides of PDUGetVersion strings of the masked module (empty = keep VW values)
VendorName=
PDUApiSwName=
HwName=VAS6154A
; Resource id map and faked IOCTLs: vas6154map.ini next to the DLL, written by VAS6154Mask64.exe
; Call log, written next to the DLL unless LogFile is set
Log=1
LogFile=
