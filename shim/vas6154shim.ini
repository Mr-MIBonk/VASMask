; VAS6154 mask shim configuration
[shim]
; Real D-PDU API that drives the VAS5054A
Target=C:\Program Files (x86)\Softing\D-PDU API\1.20.042\VeCom\PDUAPI_SoftingAG_1.20.042.dll
; Identity rewrite in module names and PDUGetVersion hardware name
FromName=VAS5054
ToName=VAS6154
; Only modules of this MDF module type get renamed (531 = VAS5054 in Softing MDF), 0 = all
MaskModuleTypeId=531
; Optional overrides of PDUGetVersion strings (empty = keep Softing values)
VendorName=
PDUApiSwName=
HwName=
; Call log, written next to the DLL unless LogFile is set
Log=1
LogFile=
